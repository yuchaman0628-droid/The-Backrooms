<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Backrooms 3D - Full Mechanics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden; background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none; -webkit-user-select: none;
        }

        #canvas-container { width: 100vw; height: 100vh; }

        /* UI Overlay */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; z-index: 2;
        }
        .hud-text {
            color: #ffff88; font-size: 16px; text-shadow: 2px 2px 4px #000; font-weight: bold;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background-color: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 2;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95); pointer-events: none; z-index: 1;
        }

        /* Screens (Start, GameOver, Pause) */
        .screen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #d1cc84;
            pointer-events: auto; z-index: 10; display: none;
        }
        #start-screen { display: flex; } /* Initial display */
        
        h1 {
            font-size: 40px; margin-bottom: 15px; letter-spacing: 5px; color: #e6df75;
            text-shadow: 0 0 12px rgba(230, 223, 117, 0.6); text-align: center;
        }
        p { font-size: 14px; margin-bottom: 25px; text-align: center; line-height: 1.6; max-width: 85%; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button {
            padding: 12px 24px; font-size: 16px; font-family: inherit; font-weight: bold;
            background-color: #33321d; color: #e6df75; border: 2px solid #e6df75;
            cursor: pointer; border-radius: 4px; transition: all 0.2s;
        }
        button:hover { background-color: #e6df75; color: #000; }

        /* Encyclopedia Modal */
        #book-modal {
            display: none; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%;
            background: rgba(20, 20, 20, 0.95); border: 2px solid #e6df75;
            color: #fff; z-index: 20; padding: 20px; overflow-y: auto; flex-direction: column;
        }
        .book-item { margin-bottom: 20px; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .book-item h3 { color: #e6df75; margin-bottom: 5px; }

        /* Mobile Controls */
        #touch-controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            display: none; pointer-events: none; z-index: 5;
        }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px; pointer-events: auto; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(230, 223, 117, 0.7); border-radius: 25px; pointer-events: none;
        }
        #look-zone {
            position: absolute; top: 0; right: 0; width: 50%; height: 100%;
            pointer-events: auto; touch-action: none;
        }
        #dash-btn {
            position: absolute; bottom: 40px; right: 40px; width: 70px; height: 70px;
            background: rgba(230, 223, 117, 0.3); border: 2px solid rgba(230, 223, 117, 0.7);
            border-radius: 35px; color: #fff; font-weight: bold; pointer-events: auto;
            display: flex; justify-content: center; align-items: center;
        }
        #dash-btn:active { background: rgba(230, 223, 117, 0.7); color: #000; }
        #mobile-pause-btn {
            position: absolute; top: 20px; right: 20px; padding: 10px 15px;
            background: rgba(0,0,0,0.5); border: 1px solid #e6df75; color: #e6df75;
            pointer-events: auto; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="vignette"></div>
    <div id="crosshair"></div>

    <div id="ui">
        <div class="hud-text" id="level-display">LEVEL 0 - THE BACKROOMS</div>
        <div class="hud-text" id="status-text">【目標】赤い「EXIT」の扉を探せ</div>
    </div>

    <!-- Mobile UI Buttons -->
    <button id="mobile-pause-btn" style="display:none;">PAUSE</button>

    <!-- Start / Game Over Screen -->
    <div id="start-screen" class="screen-overlay">
        <h1 id="title-text">THE BACKROOMS</h1>
        <p id="desc-text">
            <b>[PC操作]</b> WASD移動 / マウス視点 / Shift ダッシュ / ESC ポーズ<br>
            <b>[スマホ操作]</b> 左スティック移動 / 右画面視点 / DASHボタン
        </p>
        <button id="start-btn">探索を開始する</button>
        <div class="btn-group">
            <button onclick="openBook('entity')">エンティティ図鑑</button>
            <button onclick="openBook('level')">Level図鑑</button>
        </div>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="screen-overlay">
        <h1>PAUSED</h1>
        <button id="resume-btn">ゲームに戻る</button>
    </div>

    <!-- Encyclopedia Modal -->
    <div id="book-modal">
        <h2 id="book-title" style="color:#e6df75; margin-bottom: 20px; text-align: center;">図鑑</h2>
        <div id="book-content"></div>
        <button onclick="closeBook()" style="margin-top: 20px; align-self: center;">閉じる</button>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="dash-btn">DASH</div>
        <div id="look-zone"></div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- AUDIO SYSTEM (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmOscillator = null;
        let bgmGain = null;
        let lastStepTime = 0;

        function startBGM() {
            if (bgmOscillator) return; // 既に鳴っていればスルー
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // バックルームの重低音ハムノイズ
            bgmOscillator = audioCtx.createOscillator();
            bgmOscillator.type = 'sine';
            bgmOscillator.frequency.value = 55; // 低いブーンという音

            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.5; // ゆっくり音を揺らす
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 5;
            lfo.connect(lfoGain);
            lfoGain.connect(bgmOscillator.frequency);
            lfo.start();

            bgmGain = audioCtx.createGain();
            bgmGain.gain.value = 0.03; // かなり小さい音量

            bgmOscillator.connect(bgmGain);
            bgmGain.connect(audioCtx.destination);
            bgmOscillator.start();
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'step') {
                if (Date.now() - lastStepTime < (isRunning ? 250 : 400)) return;
                lastStepTime = Date.now();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'clear') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0, now + 1);
                osc.start(now); osc.stop(now + 1);
            } else if (type === 'death') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(20, now + 1.5);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 1.5);
                osc.start(now); osc.stop(now + 1.5);
            }
        }

        // --- LEVEL DATA ---
        const levelsData = [
            {
                name: "LEVEL 0 - THE LOBBY",
                wallBase: '#ccbe5a', wallLine: '#a89a42', floorBase: '#5e5433', floorDot: '#423b22',
                ceilColor: 0xb8b07d, ambientColor: 0xd1c78e, ambientIntensity: 1.2, fogColor: 0x1a190e,
                entities: ["howler", "smiler"], design: 0, ceilingHeight: 3
            },
            {
                name: "LEVEL 1 - HABITABLE ZONE",
                wallBase: '#555555', wallLine: '#333333', floorBase: '#444444', floorDot: '#222222',
                ceilColor: 0x333333, ambientColor: 0xffffff, ambientIntensity: 0.7, fogColor: 0x222222,
                entities: ["hound"], design: 1, ceilingHeight: 4.5
            },
            {
                name: "LEVEL 3 - ELECTRICAL STATION",
                wallBase: '#3a1f11', wallLine: '#1f1009', floorBase: '#1a1a1a', floorDot: '#333333',
                ceilColor: 0x111111, ambientColor: 0xffaa55, ambientIntensity: 0.6, fogColor: 0x1a0502,
                entities: ["smiler", "faceling"], design: 3, ceilingHeight: 3.5
            }
        ];
        let currentLevel = 0;

        // --- ENCYCLOPEDIA ---
        const encyclopedia = {
            entity: [
                { name: "ハウラー (Bacteria)", desc: "Level 0に生息。針金が絡み合ったような真っ黒な体を持つ。巨体で這い寄ってくる。" },
                { name: "スマイリー (Smiler)", desc: "暗闇に浮かぶ発光する笑顔。姿は見えず、暗闇と同化している。" },
                { name: "ハウンド (Hound)", desc: "Level 1に生息。四つん這いで骨格が歪んだ人型。獣のように素早く襲ってくる。" },
                { name: "フェイスリング (Faceling)", desc: "Level 3に生息。スーツを着た人型だが、顔のパーツが完全に欠落している。" }
            ],
            level: [
                { name: "Level 0 - The Lobby", desc: "黄色い壁紙と湿った絨毯の迷宮。" },
                { name: "Level 1 - Habitable Zone", desc: "天井が高く、コンクリートの柱が立ち並ぶ巨大な倉庫。" },
                { name: "Level 3 - Electrical Station", desc: "灼熱のパイプが天井を這う、狭くて暗い配電所。" }
            ]
        };

        function openBook(type) {
            document.getElementById('book-modal').style.display = 'flex';
            document.getElementById('book-title').innerText = type === 'entity' ? "エンティティ図鑑" : "Level図鑑";
            let html = "";
            encyclopedia[type].forEach(item => {
                html += `<div class="book-item"><h3>${item.name}</h3><p style="text-align:left;">${item.desc}</p></div>`;
            });
            document.getElementById('book-content').innerHTML = html;
        }
        function closeBook() { document.getElementById('book-modal').style.display = 'none'; }

        // --- MAP GENERATOR (ランダム生成) ---
        const MAP_SIZE = 16;
        let map = [];
        let exitPos = {x:0, z:0};
        
        function generateRandomMap(designType) {
            let newMap = Array.from({length: MAP_SIZE}, () => Array(MAP_SIZE).fill(1));
            
            // ランダムウォークによる通路生成
            let x = 1, z = 1;
            newMap[z][x] = 0;
            for(let i=0; i < MAP_SIZE * MAP_SIZE * 2.5; i++) {
                let dir = Math.floor(Math.random() * 4);
                if(dir===0 && x > 2) x -= 1;
                if(dir===1 && x < MAP_SIZE-3) x += 1;
                if(dir===2 && z > 2) z -= 1;
                if(dir===3 && z < MAP_SIZE-3) z += 1;
                newMap[z][x] = 0;

                // Level 1: 柱(2)をランダムに配置
                if (designType === 1 && Math.random() < 0.05 && newMap[z][x] === 0) {
                    newMap[z][x] = 2;
                }
            }

            // 外周は確実に壁にする
            for(let i=0; i<MAP_SIZE; i++) {
                newMap[0][i] = 1; newMap[MAP_SIZE-1][i] = 1;
                newMap[i][0] = 1; newMap[i][MAP_SIZE-1] = 1;
            }
            
            // スタート地点(左上)の確保
            newMap[1][1] = 0; newMap[1][2] = 0; newMap[2][1] = 0;
            
            // ゴール地点(右下周辺の遠いところ)の確保
            let ex = MAP_SIZE-2, ez = MAP_SIZE-2;
            newMap[ez][ex] = 0; newMap[ez][ex-1] = 0; newMap[ez-1][ex] = 0;
            exitPos = {x: ex, z: ez};

            return newMap;
        }

        // --- VARIABLES ---
        const UNIT_SIZE = 4;
        let scene, camera, renderer;
        let isPlaying = false, isPaused = false;
        let lightsList = [];
        let exitDoor = null;
        let entities = [];

        // Input States
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isRunning = false;
        let yaw = Math.PI/4, pitch = 0;

        const player = { speed: 0.07, runSpeed: 0.13 };
        const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        let isEventsSetup = false;

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const titleText = document.getElementById('title-text');
        const descText = document.getElementById('desc-text');
        const mobilePauseBtn = document.getElementById('mobile-pause-btn');

        // --- TEXTURE GENERATORS ---
        function createWallTexture(baseCol, lineCol) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseCol; ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = lineCol; ctx.lineWidth = 4;
            for(let i = 0; i < 256; i += 16) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke(); }
            for (let i = 0; i < 2000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.05)';
                ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createFloorTexture(baseCol, dotCol, designType) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseCol; ctx.fillRect(0, 0, 128, 128);
            
            if (designType === 3) {
                // Level 3 グリッド床
                ctx.strokeStyle = dotCol; ctx.lineWidth = 2;
                for(let i=0; i<128; i+=16){ ctx.strokeRect(i, 0, 16, 128); ctx.strokeRect(0, i, 128, 16); }
            } else {
                for (let i = 0; i < 1500; i++) {
                    ctx.fillStyle = dotCol; ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(MAP_SIZE, MAP_SIZE);
            return texture;
        }

        function createSmilerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,256,256); // 背景を完全に透明に
            ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.ellipse(80, 90, 20, 35, -0.2, 0, Math.PI * 2);
            ctx.ellipse(176, 90, 20, 35, 0.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(128, 130, 80, 0.1 * Math.PI, 0.9 * Math.PI, false);
            ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff'; ctx.stroke();
            for(let x = 60; x <= 196; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, 180); ctx.lineTo(x, 205);
                ctx.lineWidth = 3; ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createExitDoorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8b0000'; ctx.fillRect(0, 0, 256, 512);
            ctx.strokeStyle = '#330000'; ctx.lineWidth = 10; ctx.strokeRect(10, 10, 236, 492);
            ctx.fillStyle = '#00ff00'; ctx.font = 'bold 50px Arial'; ctx.textAlign = 'center';
            ctx.fillText('EXIT', 128, 100);
            return new THREE.CanvasTexture(canvas);
        }

        // --- ENTITY CREATORS (本家準拠の造形) ---
        function createHowlerMesh() {
            // Bacteria / Wireframe
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.5, 5), mat);
            spine.position.y = 1.75; group.add(spine);
            
            // 歪んだ手足
            for(let i=0; i<4; i++) {
                const limb = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2, 5), mat);
                limb.position.set((Math.random()-0.5), 1.5 + Math.random(), (Math.random()-0.5));
                limb.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                group.add(limb);
            }
            // 頭部の混沌
            for(let i=0; i<8; i++) {
                const tendril = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 1.2, 3), mat);
                tendril.position.set(0, 3.2, 0);
                tendril.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                group.add(tendril);
            }
            return group;
        }

        function createSmilerMesh() {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({ map: createSmilerTexture(), transparent: true, depthWrite: false });
            const face = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), mat);
            face.position.y = 1.6; group.add(face);
            const light = new THREE.PointLight(0xffffff, 0.5, 4);
            light.position.y = 1.6; group.add(light);
            return group;
        }

        function createHoundMesh() {
            // 四つん這いの獣型
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x221105, roughness: 1.0 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x886655, roughness: 0.8 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 1.2), mat);
            torso.position.y = 0.5; group.add(torso);
            
            // 手足
            const legGeo = new THREE.CylinderGeometry(0.08, 0.05, 0.6);
            const fl = new THREE.Mesh(legGeo, skinMat); fl.position.set(0.3, 0.3, 0.5); group.add(fl);
            const fr = new THREE.Mesh(legGeo, skinMat); fr.position.set(-0.3, 0.3, 0.5); group.add(fr);
            const bl = new THREE.Mesh(legGeo, skinMat); bl.position.set(0.2, 0.3, -0.5); group.add(bl);
            const br = new THREE.Mesh(legGeo, skinMat); br.position.set(-0.2, 0.3, -0.5); group.add(br);

            // 頭 (髪の毛で覆われている)
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3), mat);
            head.position.set(0, 0.6, 0.8); group.add(head);

            return group;
        }

        function createFacelingMesh() {
            const group = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xeecba6 });
            const suitMat = new THREE.MeshStandardMaterial({ color: 0x111111 }); // 黒スーツ
            
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.3), suitMat);
            torso.position.y = 1.2; group.add(torso);
            
            const legGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.8);
            const lLeg = new THREE.Mesh(legGeo, suitMat); lLeg.position.set(0.15, 0.4, 0); group.add(lLeg);
            const rLeg = new THREE.Mesh(legGeo, suitMat); rLeg.position.set(-0.15, 0.4, 0); group.add(rLeg);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22), skinMat);
            head.position.y = 1.9; head.scale.z = 1.2; // のっぺらぼう
            group.add(head);

            return group;
        }

        function createExitDoorMesh() {
            const group = new THREE.Group();
            const door = new THREE.Mesh(new THREE.BoxGeometry(2, 2.8, 0.1), new THREE.MeshStandardMaterial({ map: createExitDoorTexture() }));
            door.position.y = 1.4; group.add(door);
            const exitLight = new THREE.PointLight(0x00ff00, 1.5, 6);
            exitLight.position.set(0, 2, 0.5); group.add(exitLight);
            return group;
        }

        // --- SCENE SETUP ---
        function initScene() {
            const levelD = levelsData[currentLevel];
            document.getElementById('level-display').innerText = levelD.name;

            // マップのランダム生成
            map = generateRandomMap(levelD.design);

            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(levelD.fogColor);
            scene.fog = new THREE.FogExp2(levelD.fogColor, 0.035);

            if (!camera) camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(1.5 * UNIT_SIZE, 1.6, 1.5 * UNIT_SIZE);
            yaw = Math.PI/4; pitch = 0;

            if (!renderer) {
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            }
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(levelD.ambientColor, levelD.ambientIntensity));
            scene.add(camera);

            const wallTex = createWallTexture(levelD.wallBase, levelD.wallLine);
            wallTex.wrapS = THREE.RepeatWrapping; wallTex.wrapT = THREE.RepeatWrapping;
            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.8 });
            const floorMat = new THREE.MeshStandardMaterial({ map: createFloorTexture(levelD.floorBase, levelD.floorDot, levelD.design), roughness: 0.9 });
            const ceilingMat = new THREE.MeshStandardMaterial({ color: levelD.ceilColor, roughness: 0.5 });
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });

            const totalMapSize = MAP_SIZE * UNIT_SIZE;
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(totalMapSize, totalMapSize), floorMat);
            floor.rotation.x = -Math.PI / 2; floor.position.set(totalMapSize / 2, 0, totalMapSize / 2);
            scene.add(floor);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(totalMapSize, totalMapSize), ceilingMat);
            ceiling.rotation.x = Math.PI / 2; ceiling.position.set(totalMapSize / 2, levelD.ceilingHeight, totalMapSize / 2);
            scene.add(ceiling);

            lightsList = [];
            entities = [];

            const wallGeo = new THREE.BoxGeometry(UNIT_SIZE, levelD.ceilingHeight, UNIT_SIZE);
            const pillarGeo = new THREE.BoxGeometry(UNIT_SIZE/2, levelD.ceilingHeight, UNIT_SIZE/2);
            const lightGeo = new THREE.BoxGeometry(1.6, 0.1, 0.4);

            for (let r = 0; r < MAP_SIZE; r++) {
                for (let c = 0; c < MAP_SIZE; c++) {
                    if (map[r][c] === 1) {
                        const wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(c * UNIT_SIZE + UNIT_SIZE / 2, levelD.ceilingHeight/2, r * UNIT_SIZE + UNIT_SIZE / 2);
                        scene.add(wall);
                    } else if (map[r][c] === 2) { // Level 1 柱
                        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                        pillar.position.set(c * UNIT_SIZE + UNIT_SIZE / 2, levelD.ceilingHeight/2, r * UNIT_SIZE + UNIT_SIZE / 2);
                        scene.add(pillar);
                    } else if ((r % 3 === 0 && c % 3 === 0)) {
                        const ceilLightMesh = new THREE.Mesh(lightGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
                        ceilLightMesh.position.set(c * UNIT_SIZE + UNIT_SIZE/2, levelD.ceilingHeight - 0.05, r * UNIT_SIZE + UNIT_SIZE/2);
                        scene.add(ceilLightMesh);
                        const pLight = new THREE.PointLight(0xfff5cc, levelD.ambientIntensity, 12);
                        pLight.position.set(c * UNIT_SIZE + UNIT_SIZE/2, levelD.ceilingHeight - 0.3, r * UNIT_SIZE + UNIT_SIZE/2);
                        scene.add(pLight);
                        lightsList.push({ light: pLight, baseIntensity: levelD.ambientIntensity, mesh: ceilLightMesh });
                    }
                }
            }

            // Level 3専用: 天井のパイプ装飾
            if (levelD.design === 3) {
                const pipeMat = new THREE.MeshStandardMaterial({ color: 0x442211, roughness: 0.4, metalness: 0.5 });
                for(let i=1; i<MAP_SIZE; i+=2) {
                    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, totalMapSize), pipeMat);
                    pipe.rotation.z = Math.PI/2;
                    pipe.position.set(totalMapSize/2, levelD.ceilingHeight - 0.3, i * UNIT_SIZE);
                    scene.add(pipe);
                }
            }

            // Spawn Exit (ランダム生成した位置)
            exitDoor = createExitDoorMesh();
            exitDoor.position.set(exitPos.x * UNIT_SIZE + UNIT_SIZE/2, 0, exitPos.z * UNIT_SIZE + UNIT_SIZE/2);
            scene.add(exitDoor);

            // Spawn Entities
            levelD.entities.forEach((eType, index) => {
                let mesh, speed, name;
                if (eType === "howler") { mesh = createHowlerMesh(); speed = 0.048; name = "ハウラー"; }
                if (eType === "smiler") { mesh = createSmilerMesh(); speed = 0.04; name = "スマイリー"; }
                if (eType === "hound") { mesh = createHoundMesh(); speed = 0.065; name = "ハウンド"; }
                if (eType === "faceling") { mesh = createFacelingMesh(); speed = 0.042; name = "フェイスリング"; }
                
                // ランダムな空きマスに配置
                let ex = 0, ez = 0;
                while(map[ez][ex] !== 0 || (ex < 4 && ez < 4)) {
                    ex = Math.floor(Math.random() * (MAP_SIZE-2)) + 1;
                    ez = Math.floor(Math.random() * (MAP_SIZE-2)) + 1;
                }
                mesh.position.set(ex * UNIT_SIZE + UNIT_SIZE/2, 0, ez * UNIT_SIZE + UNIT_SIZE/2);
                scene.add(mesh);
                entities.push({ name: name, mesh: mesh, speed: speed, type: eType });
            });

            if (!isEventsSetup) {
                setupControls();
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
                isEventsSetup = true;
                animate();
            }
        }

        // --- CONTROLS ---
        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isRunning = true;
                if (e.code === 'Escape' && isPlaying) togglePause(); // PC ポーズ
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
                if (e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
                if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') isRunning = false;
            });
            document.addEventListener('mousemove', (e) => {
                if (!isPlaying || isPaused) return;
                if (document.pointerLockElement === document.body || isMobile) {
                    yaw -= e.movementX * 0.0025;
                    pitch -= e.movementY * 0.0025;
                    pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
                }
            });

            // Pointer Lock Event (ESCを押した時の自動解除検知)
            document.addEventListener('pointerlockchange', () => {
                if (!isMobile && document.pointerLockElement !== document.body && isPlaying && !isPaused) {
                    togglePause();
                }
            });

            if (isMobile) {
                document.getElementById('touch-controls').style.display = 'block';
                mobilePauseBtn.style.display = 'block';
                setupTouchEvents();
            }
        }

        function setupTouchEvents() {
            const joystickZone = document.getElementById('joystick-zone');
            const joystickKnob = document.getElementById('joystick-knob');
            const lookZone = document.getElementById('look-zone');
            const dashBtn = document.getElementById('dash-btn');
            
            let moveTouchId = null, lookTouchId = null;
            let touchStartX = 0, touchStartY = 0, lastLookX = 0, lastLookY = 0;

            dashBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; });
            dashBtn.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; });
            mobilePauseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); });

            joystickZone.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    if (moveTouchId === null) {
                        moveTouchId = touch.identifier;
                        touchStartX = touch.clientX; touchStartY = touch.clientY;
                    }
                }
            });
            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === moveTouchId) {
                        let dx = touch.clientX - touchStartX, dy = touch.clientY - touchStartY;
                        let dist = Math.min(Math.hypot(dx, dy), 40);
                        let angle = Math.atan2(dy, dx);
                        joystickKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                        moveForward = dy < -10; moveBackward = dy > 10; moveLeft = dx < -10; moveRight = dx > 10;
                    }
                    if (touch.identifier === lookTouchId) {
                        yaw -= (touch.clientX - lastLookX) * 0.006;
                        pitch -= (touch.clientY - lastLookY) * 0.006;
                        pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
                        lastLookX = touch.clientX; lastLookY = touch.clientY;
                    }
                }
            });
            const resetTouch = (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === moveTouchId) {
                        moveTouchId = null; joystickKnob.style.transform = `translate(0px, 0px)`;
                        moveForward = moveBackward = moveLeft = moveRight = false;
                    }
                    if (touch.identifier === lookTouchId) lookTouchId = null;
                }
            };
            window.addEventListener('touchend', resetTouch);
            window.addEventListener('touchcancel', resetTouch);
            lookZone.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    if (lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lastLookX = touch.clientX; lastLookY = touch.clientY;
                    }
                }
            });
        }

        // --- LOGIC ---
        function checkWallCollision(newX, newZ) {
            const padding = 0.5;
            const pts = [{x:newX+padding, z:newZ+padding}, {x:newX-padding, z:newZ+padding}, {x:newX+padding, z:newZ-padding}, {x:newX-padding, z:newZ-padding}];
            for (let pt of pts) {
                const gX = Math.floor(pt.x / UNIT_SIZE), gZ = Math.floor(pt.z / UNIT_SIZE);
                if (gX < 0 || gX >= MAP_SIZE || gZ < 0 || gZ >= MAP_SIZE) return true;
                if (map[gZ][gX] === 1 || map[gZ][gX] === 2) return true; // 壁(1)か柱(2)
            }
            return false;
        }

        function updatePlayer() {
            const dirX = Math.sin(yaw), dirZ = Math.cos(yaw);
            let moveX = 0, moveZ = 0;
            if (moveForward)  { moveX -= dirX; moveZ -= dirZ; }
            if (moveBackward) { moveX += dirX; moveZ += dirZ; }
            if (moveLeft)     { moveX -= dirZ; moveZ += dirX; }
            if (moveRight)    { moveX += dirZ; moveZ -= dirX; }

            const len = Math.hypot(moveX, moveZ);
            if (len > 0) {
                const currentSpeed = isRunning ? player.runSpeed : player.speed;
                moveX = (moveX / len) * currentSpeed; moveZ = (moveZ / len) * currentSpeed;
                if (!checkWallCollision(camera.position.x + moveX, camera.position.z)) camera.position.x += moveX;
                if (!checkWallCollision(camera.position.x, camera.position.z + moveZ)) camera.position.z += moveZ;
                
                camera.position.y = 1.6 + Math.sin(Date.now() * (isRunning ? 0.018 : 0.012)) * 0.05;
                playSound('step');
            } else {
                camera.position.y = 1.6;
            }

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw; camera.rotation.x = pitch;

            if (exitDoor && Math.hypot(camera.position.x - exitDoor.position.x, camera.position.z - exitDoor.position.z) < 1.8) {
                gameClear();
            }
        }

        function updateEntities() {
            for (let ent of entities) {
                const dx = camera.position.x - ent.mesh.position.x;
                const dz = camera.position.z - ent.mesh.position.z;
                const dist = Math.hypot(dx, dz);
                
                if (ent.type === "smiler") ent.mesh.lookAt(camera.position.x, 1.6, camera.position.z);
                else if (ent.type === "hound") ent.mesh.lookAt(camera.position.x, 0.5, camera.position.z);
                else ent.mesh.lookAt(camera.position.x, 0, camera.position.z);

                if (dist < 20) {
                    const stepX = (dx / dist) * ent.speed;
                    const stepZ = (dz / dist) * ent.speed;
                    // エンティティの簡易壁判定
                    if (!checkWallCollision(ent.mesh.position.x + stepX, ent.mesh.position.z)) ent.mesh.position.x += stepX;
                    if (!checkWallCollision(ent.mesh.position.x, ent.mesh.position.z + stepZ)) ent.mesh.position.z += stepZ;
                }

                if (dist < 1.3) gameOver(ent.name);
            }
        }

        function updateFluorescentLights() {
            lightsList.forEach(item => { item.light.intensity = Math.random() < 0.03 ? 0.2 : item.baseIntensity; });
        }

        // --- STATE MANAGEMENT ---
        function startGame() {
            startBGM(); // 初回クリックでBGM開始
            startScreen.style.display = 'none';
            pauseScreen.style.display = 'none';
            isPlaying = true; isPaused = false;
            if (!isMobile) document.body.requestPointerLock();
        }

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseScreen.style.display = 'flex';
                if (!isMobile && document.pointerLockElement) document.exitPointerLock();
            } else {
                pauseScreen.style.display = 'none';
                if (!isMobile) document.body.requestPointerLock();
            }
        }

        function gameOver(killerName) {
            isPlaying = false;
            playSound('death');
            if (!isMobile && document.pointerLockElement) document.exitPointerLock();
            titleText.innerText = "YOU DIED"; titleText.style.color = "#ff3333";
            descText.innerHTML = `<b>【${killerName}】</b>に捉えられてしまった...`;
            document.getElementById('start-btn').innerText = "リトライ"; 
            startScreen.style.display = 'flex';
            initScene();
        }

        function gameClear() {
            isPlaying = false;
            playSound('clear');
            if (!isMobile && document.pointerLockElement) document.exitPointerLock();

            currentLevel++;
            if (currentLevel >= levelsData.length) {
                titleText.innerText = "ALL STAGE CLEARED!"; titleText.style.color = "#55ff55";
                descText.innerHTML = "全ての階層を突破し、現実世界へ帰還した！<br>おめでとう！";
                document.getElementById('start-btn').innerText = "最初から遊ぶ";
                currentLevel = 0; 
            } else {
                titleText.innerText = "LEVEL CLEARED"; titleText.style.color = "#55ff55";
                descText.innerHTML = `無事に扉へ到達した！<br>次は ${levelsData[currentLevel].name} へ進む...`;
                document.getElementById('start-btn').innerText = "次のLevelへ";
            }
            startScreen.style.display = 'flex';
            initScene();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isPlaying && !isPaused) {
                updatePlayer();
                updateEntities();
                updateFluorescentLights();
            }
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        
        initScene();
    </script>
</body>
</html>
